-My Java Learning Journey

	Welcome to my Java studies repository.

	This project represents my evolution in the Java language during my **Object-Oriented Programming (OOP) course at university**.

	Here I will store my exercises, practices and small projects while improving my skills in Java.

-Goal

	My goal is to build a strong foundation in Java, not only to complete my university course, but also to continue learning and using this language throughout my programming journey.

	I want to go beyond the classroom, explore Java deeply, and develop the skills needed to create real-world applications.

-My Journey

	This repository will be continuously updated as I progress in Java, documenting my learning process, challenges solved, and new concepts explored.

	My objective is to look back at this project in the future and see my growth from the first programs to more complete and complex applications.


>>Evolution comes from constant practice.